name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, for example v0.2.1"
        required: true
        type: string

permissions:
  contents: write

jobs:
  hacs-release:
    name: Build and publish HACS release
    runs-on: ubuntu-latest

    steps:
      - name: Resolve release metadata
        id: release
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            tag="${DISPATCH_TAG}"
          else
            tag="${GITHUB_REF_NAME}"
          fi

          prerelease=false
          case "${tag}" in
            *-alpha*|*-beta*|*-rc*)
              prerelease=true
              ;;
          esac

          {
            echo "tag=${tag}"
            echo "prerelease=${prerelease}"
          } >> "${GITHUB_OUTPUT}"

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}

      - name: Verify HACS package shape
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          scripts/build-hacs-release.sh
          unzip -t dist/lemonade.zip
          unzip -l dist/lemonade.zip | grep "custom_components/lemonade/manifest.json"
          unzip -l dist/lemonade.zip | grep "custom_components/lemonade/brand/icon.png"
          RELEASE_TAG="${RELEASE_TAG}" python - <<'PY'
          import json
          import os
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          version = json.loads(
              Path("custom_components/lemonade/manifest.json").read_text()
          )["version"]
          if tag.removeprefix("v") != version:
              raise SystemExit(
                  f"release tag {tag!r} does not match manifest version {version!r}"
              )
          PY

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.tag }}
          prerelease: ${{ steps.release.outputs.prerelease }}
          generate_release_notes: true
          files: dist/lemonade.zip
          fail_on_unmatched_files: true
